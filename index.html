<style>

  --bg:#f5f3ee;--card:#fff;--ink:#1d1b18;--muted:#6f6a61;--line:#e6e1d7;

  --accent:#1d1b18;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151412;--card:#1f1d1a;--ink:#f2efe9;--muted:#a39d92;--line:#33302b;
  --pagi-bg:#3a2c16;--petang-bg:#1d2544;--ot-bg:#3d1625;--off-bg:#2a2824;--stby-bg:#173020;--accent:#f2efe9;--hol-bg:#3d1525;--leave-bg:#123a40;--swap-bg:#3e2312;--leave:#3bc9db;--swap:#ff922b;--ev-bg:#271d4a;--ev:#a18cff;--hol:#f06595;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
#root{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{white-space:nowrap;border:0;background:none;padding:8px 14px;border-radius:9px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.next{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.next .big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.p-pagi{background:var(--pagi-bg);color:var(--pagi)}
.p-petang{background:var(--petang-bg);color:var(--petang)}
.p-ot{background:var(--ot-bg);color:var(--ot)}
.p-off{background:var(--off-bg);color:var(--off)}
.code.est,.pill.est{background:transparent;border:1px dashed var(--off);color:var(--off);opacity:.85}
.p-stby{background:var(--stby-bg);color:var(--stby)}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.monthbar h2{margin:0;font-size:18px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding-bottom:2px}
.day{min-width:0;overflow:hidden;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative}
.day:hover{border-color:var(--muted)}
.day.empty{background:transparent;border:0;cursor:default}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.day .n{font-size:12px;font-weight:700;color:var(--muted)}
.day .code{font-size:12px;font-weight:700;padding:2px 5px;border-radius:6px;line-height:1.25}
.day .t{font-size:10.5px;color:var(--muted);font-weight:500}
.day.off{background:var(--off-bg)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:800;border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=number]{width:90px}
input[type=time]{width:110px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:420px;width:100%;margin:0;max-height:90vh;overflow-y:auto}
.note{font-size:12.5px;color:var(--muted)}
.warn{background:var(--pagi-bg);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:10}
a{color:var(--petang)}
.day .hol{font-size:10.5px;font-weight:700;color:var(--hol);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .ev{font-size:10.5px;font-weight:700;color:var(--ev);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.isHol{border-color:var(--hol)}
.p-leave{background:var(--leave-bg);color:var(--leave)}
.p-swap{background:var(--swap-bg);color:var(--swap)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer}
.seg input{display:none}
.seg label:has(input:checked){background:var(--accent);color:var(--bg);border-color:var(--accent)}
.p-hol{background:var(--hol-bg);color:var(--hol)}
.p-ev{background:var(--ev-bg);color:var(--ev)}
.list .item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px}
@media (max-width:600px){.day .ev,.day .hol{font-size:9.5px}.day{min-height:64px;padding:4px}.day .t{display:none}.day .code{font-size:11px;padding:1px 3px}.grid{gap:3px}}

/* Huruf besar di awal setiap perkataan untuk label, tajuk & butang (keputusan Faisal 18 Nov) */
h1,h2,.tabs button,.btn,.card b,.stat .l,label,.pill,.code,.seg label,.modal .card>b,th{text-transform:capitalize}
</style>

  if(!L.length)h+=`<tr><td colspan="6" class="note">Tiada OT bulan ni.</td></tr>`;
  h+=`</tbody><tfoot><tr><td colspan="4">Jumlah</td><td class="num">${fh(tot)}</td><td>${fh(done)} dah buat</td></tr></tfoot></table></div>`;
  return h;
}

}

    if(odv&&parseDay(v).shifts.length>1&&!(S.otDuty[ck]&&v.includes(S.otDuty[ck]))){toast('Hari ni dah double shift, tak boleh tambah OT duty lagi');return}
    if(odv)S.otDuty[ck]=odv;else delete S.otDuty[ck];
    {const xs=md.querySelector('#exS'),xe=md.querySelector('#exE');if(xs&&xe&&!(xs.dataset.touched||xe.dataset.touched)){if(JSON.stringify(v)!==prevSlots)delete S.excess[ck]; /* shift bertukar: excess ikut duty baru */}else if(xs&&xe){const nr=x=>{const v=norm24(x.value,x);return v||''};const vs=nr(xs),ve=nr(xe);
      const r0=dayCalc(`${y}-${m}`,d);const en=r0.spans[0]&&r0.spans[0][1];const st0=en&&new Date(+en-(+S.claimHour.jam||1)*3600000);
      const def=en&&vs===hhmm(st0,y,m,d).replace(/(\d\d)$/,':$1')&&ve===hhmm(en,y,m,d).replace(/(\d\d)$/,':$1');
      if(!vs||!ve||def)delete S.excess[ck];else S.excess[ck]={st:vs,en:ve};}}
    let os=md.querySelector('#otS').value,oe=md.querySelector('#otE').value,opsMode;
    if(md.querySelector('#otT').value==='signoff'){os='';oe='';const el=md.querySelector('#otSO');if(el&&el.value){const en=new Date(Math.max(...r.spans.map(x=>+x[1])));os=hhmm(en,r.y,r.mo,r.d).replace(/(\d\d)$/,':$1');oe=el.value;}}
    if(md.querySelector('#otT').value==='ops'){os='';oe='';const el=md.querySelector('#otOps');if(el&&el.value){const sp=r.spans,st=new Date(Math.min(...sp.map(x=>+x[0]))),en=new Date(Math.max(...sp.map(x=>+x[1])));
      opsMode=md.querySelector('input[name=otOpsM]:checked').value;const hr=x=>hhmm(x,r.y,r.mo,r.d).replace(/(\d\d)$/,':$1');if(opsMode==='awal'){os=el.value;oe=hr(st)}else{os=hr(en);oe=el.value}}}
    if(os&&oe&&md.querySelector('#otT').value==='cover'&&v.length>1){toast('Hari double shift tak boleh claim OT Cover Meal Break');return}
    if(os&&oe){(S.otManual[ck]=S.otManual[ck]||[]).push({start:os,end:oe,note:md.querySelector('#otN').value.trim(),type:md.querySelector('#otT').value,...(opsMode?{mode:opsMode}:{})});}
    else if(os||oe){toast('Isi masa mula dan tamat OT');return}
    md.remove();render();save('Hari dikemas kini');
  };
}

function claimRows(){
  const {rows,T}=monthCalc(cur);const [y,m]=cur.split('-').map(Number);
  const head=['Tarikh','Hari','Kod Shift','Catatan','Masa','Elaun Pagi (RM)','Elaun Petang (RM)','Elaun CTO (RM)','Jam OT','Standby (RM)','Jumlah (RM)'];
  const body=rows.filter(r=>r.shifts.length||r.stby||r.ctoFlag||r.otTot).map(r=>[`${pad(r.d)}/${pad(r.mo)}/${r.y}`,HARI[new Date(r.y,r.mo-1,r.d).getDay()],r.raw,r.workPH?'Kerja hari cuti umum ('+r.holiday+')':'',spanText(r),r.amt.pagi,r.amt.petang,r.amt.cto,+fh(r.otTot),r.amt.stby,r.amt.total]);
  const tot=['JUMLAH','','','','',T.pagi,T.petang,T.cto,+fh(T.otTot),T.stby,T.total];
  return {head,body,tot,T,title:`Claim Elaun ${BULAN[m-1]} ${y}`,file:`Claim_${BULAN[m-1]}_${y}_${S.name.split(' ').slice(-1)[0]}`};
}
async function dl(ext){
  if(!cap.downloads){toast('Muat turun tak tersedia di paparan ni');return}
  const c=claimRows();let data;
  if(ext==='xlsx'){
    if(!window.XLSX){toast('Excel tak dapat dimuat, guna CSV');return}
    const aoa=[[c.title],[`Nama: ${S.name}`,'','',`No. Pekerja: ${S.staffNo}`],[],c.head,...c.body,c.tot];
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:12},{wch:9},{wch:14},{wch:30},{wch:22},{wch:14},{wch:15},{wch:13},{wch:9},{wch:12},{wch:12}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Claim');
    const OL=otList(cur);const ws2=XLSX.utils.aoa_to_sheet([[`Rekod Jam OT ${c.title.replace('Claim Elaun ','')}`],[`Nama: ${S.name}`,'','',`No. Pekerja: ${S.staffNo}`],[],['Tarikh','Hari','Jenis','Mula','Tamat','Jam','Catatan','Status'],...OL.map(o=>[`${pad(o.r.d)}/${pad(o.r.mo)}/${o.r.y}`,HARI[new Date(o.r.y,o.r.mo-1,o.r.d).getDay()],o.kind,fmtTime(o.st,new Date(o.r.y,o.r.mo-1,o.r.d)),fmtTime(o.en,new Date(o.r.y,o.r.mo-1,o.r.d)),+fh(o.h),o.note,o.done?'Dah buat':'Akan datang']),['JUMLAH','','','','',+fh(OL.reduce((a,b)=>a+b.h,0)),'','']]);
    ws2['!cols']=[{wch:12},{wch:9},{wch:13},{wch:7},{wch:7},{wch:6},{wch:18},{wch:12}];XLSX.utils.book_append_sheet(wb,ws2,'Rekod OT');
    data=new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'}));
  }else{
    const q=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    data=[[c.title],[`Nama: ${S.name}`],[],c.head,...c.body,c.tot].map(r=>r.map(q).join(',')).join('\n');
  }
  try{await cap.downloads.save({filename:`${c.file}.${ext}`,data})}catch(e){if(e&&e.code!=='declined')toast('Tak dapat muat turun: '+(e.code||'ralat'))}
}
async function copySum(){
  const c=claimRows();const T=c.T;
  const txt=`${c.title}\n${S.name} (${S.staffNo})\nShift pagi: ${T.nPagi} x RM${S.rates.pagi} = RM${T.pagi.toFixed(2)}\nShift petang: ${T.nPetang} x RM${S.rates.petang} = RM${T.petang.toFixed(2)}\nCTO: ${T.nCto} x RM${S.rates.cto} = RM${T.cto.toFixed(2)}\nJam OT: ${fh(T.otTot)} jam (dah buat ${fh(T.otDone)} jam)\nJUMLAH ELAUN: RM${T.total.toFixed(2)}`;
  try{await navigator.clipboard.writeText(txt);toast('Ringkasan disalin')}catch(e){toast('Tak dapat salin')}
}

async function decryptRoster(enc,pw){

async function syncRoster(pw,id,opts={}){

  const idx=await (await fetch('roster/index.json',{cache:'no-store'})).json();
  let found=0,added=[];
  for(const mk of idx.months){
    const enc=await (await fetch(`roster/${mk}.enc.json`,{cache:'no-store'})).json();
    let data;try{data=await decryptRoster(enc,pw)}catch(e){throw new Error('pw')}
    const me=data.staff.find(x=>String(x.id).replace(/^0+/,'')===id);
    if(!me)continue;found++;
    const [yy,mm]=mk.split('-').map(Number);const k=`${yy}-${mm}`;
    const had=!!S.months[k];const mo=S.months[k]||{};const out={};
    for(let d=1;d<=monthDays(k);d++){
      const ch=S.changes[dkey(yy,mm,d)];
      if(ch&&mo[d]) out[d]=mo[d];
      else if(me.days[d]&&me.days[d].length) out[d]=me.days[d];
    }
    S.months[k]=out;if(!had)added.push(k);
    if(data.sigs)S.sigs=data.sigs;S.team=S.team||{};S.team[k]=data.staff.map(x=>({id:String(x.id),name:x.name,days:x.days,leader:x.leader||''}));if(me.leader){S.form=S.form||{};S.form.superior=me.leader;}
    if(opts.login||!S.name)S.name=me.name;S.staffNo=String(me.id);S.line=me.line;
  }

}

  else if(t.id==='bkSave')saveBackup();
  else if(t.id==='dlics')dlIcs();
  else if(t.id==='cpyot'){const L=otList(cur).filter(o=>o.kind!=='1 jam shift');const [yy,mm]=cur.split('-').map(Number);const txt=`Rekod OT ${BULAN[mm-1]} ${yy}\n${S.name} (${S.staffNo})\n`+L.map(o=>`${o.r.d}/${o.r.mo} ${o.kind} ${fmtSpan(o.st,o.en,new Date(o.r.y,o.r.mo-1,o.r.d),'-')} = ${fh(o.h)} jam${o.done?'':' (akan datang)'}`).join('\n')+`\nJumlah: ${fh(L.reduce((a,b)=>a+b.h,0))} jam`;navigator.clipboard.writeText(txt).then(()=>toast('Rekod OT disalin')).catch(()=>toast('Tak dapat salin'))}
  else if(t.id==='saveSet'){
    root.querySelectorAll('[data-rate]').forEach(i=>S.rates[i.dataset.rate]=parseFloat(i.value)||0);{const ol=root.querySelector('#otLimit');if(ol)S.otLimit=parseFloat(ol.value)||105;}
    root.querySelectorAll('[data-time]').forEach(i=>{const c=i.dataset.time;S.times[c]=S.times[c]||['',''];S.times[c][+i.dataset.i]=i.value});
    for(const c of Object.keys(S.times))if(!S.times[c][0]&&!S.times[c][1])delete S.times[c];
    S.claimHour={on:document.getElementById('chOn').checked,jam:parseFloat(document.getElementById('chJam').value)||0,swap:document.getElementById('chSw').checked};
    S.ctoAuto=document.getElementById('ctoAuto').checked;
    root.querySelectorAll('[data-form]').forEach(i=>S.form[i.dataset.form]=i.value.trim().toUpperCase());
    S.name=document.getElementById('nm').value.trim()||S.name;S.staffNo=document.getElementById('sn').value.trim();
    render();save('Tetapan disimpan');
  }
});
render();
setInterval(()=>{if(view==='kalendar')render()},60000);
/* Kemas kini automatik untuk apps yang dipasang (PWA): semak versi baru bila apps dibuka / kembali ke depan */
const APP_VERSION='2026-11-23.3';
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').then(reg=>{try{reg.update()}catch(e){}}).catch(()=>{}); }
let _updShown=false,_lastChk=0;
async function checkUpdate(manual){
  if(!navigator.onLine){if(manual)toast('Tiada internet');return}
  if(!manual&&Date.now()-_lastChk<60000)return;_lastChk=Date.now();
  try{const t=await (await fetch('index.html?v='+Date.now(),{cache:'no-store'})).text();const m=t.match(/const APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION){showUpdate(m[1])}else if(manual)toast('Apps dah versi terkini ('+APP_VERSION+')');}catch(e){if(manual)toast('Tak dapat semak kemas kini')}
}
function showUpdate(v){
  if(_updShown)return;_updShown=true;const b=document.createElement('div');
  b.style.cssText='position:fixed;left:12px;right:12px;bottom:14px;z-index:99;background:#1d1b18;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px';
  b.innerHTML='<span style="flex:1"><b>Versi baru apps tersedia.</b><br><span style="opacity:.8;font-size:12.5px">Termasuk kemas kini borang & tandatangan.</span></span><button class="btn primary" id="updGo" style="background:#fff;color:#1d1b18">Kemas kini</button>';
  document.body.appendChild(b);b.querySelector('#updGo').onclick=doUpdate;
}
async function doUpdate(){
  try{if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
    if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.update().catch(()=>{})))}}catch(e){}
  location.replace(location.pathname+'?u='+Date.now());
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkUpdate();if(S.staffNo)autoSync()}});
window.addEventListener('online',()=>{checkUpdate();if(S.staffNo)autoSync()});
setTimeout(()=>checkUpdate(),3000);
if(!S.staffNo){ view='login'; render(); } else { autoSync(); }
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lgPw'||e.target.id==='lgId'))doLogin()});
})();
</script>
