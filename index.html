*{box-sizing:border-box}

a{color:var(--petang)}

.p-leave{background:var(--leave-bg);color:var(--leave)}
.p-swap{background:var(--swap-bg);color:var(--swap)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer}
.seg input{display:none}
.seg label:has(input:checked){background:var(--accent);color:var(--bg);border-color:var(--accent)}
.p-hol{background:var(--hol-bg);color:var(--hol)}

const MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',csv:'text/csv',ics:'text/calendar',json:'application/json'};
let cap = {downloads:{save:async({filename,data})=>{const ext=filename.split('.').pop();const blob=data instanceof Blob?data:new Blob([data],{type:MIME[ext]||'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return {status:'saved'}}}};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}

function evs(y,m,d){const k=dkey(y,m,d);return S.events.filter(e=>e.date===k)}
function shiftMonth(k,n){let [y,m]=k.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${m}`}
function toMin(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function rm(n){return 'RM '+n.toFixed(2)}

// ---- parsing a day's slots ----
function parseDay(slots){

function shiftSpan(code, y, mo, d){

  if(p.shifts.length>1 && spans.length===p.shifts.length){
    const s=spans.slice().sort((a,b)=>a[0]-b[0]); let tot=0,cs=s[0][0],ce=s[0][1];
    for(let i=1;i<s.length;i++){ if(s[i][0]<=ce){ if(s[i][1]>ce)ce=s[i][1]; } else { tot+=ce-cs; cs=s[i][0]; ce=s[i][1]; } }
    tot+=ce-cs; otH=Math.max(0,(tot-(s[0][1]-s[0][0]))/3600000);

function monthDays(k){const [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()}

  rows.forEach(r=>{for(const x of ['pagi','petang','cto','stby','total'])T[x]+=r.amt[x];T.jamH+=r.jamH;T.otTot+=r.otTot;T.otDone+=r.otDone;T.manH+=r.manH;T.nPagi+=r.pagi;T.nPetang+=r.petang;T.otH+=r.otH;if(r.shifts.length>1)T.nDouble++;if(r.ctoFlag)T.nCto++;if(r.stby)T.nStby++;if(r.workPH)T.nPH++;});
  return {rows,T};
}
function fh(h){return (Math.round(h*100)/100).toString()}
function fmtTime(dt){return pad(dt.getHours())+pad(dt.getMinutes())}
function spanText(r){return r.spans.map(s=>hhmm(s[0],r.y,r.mo,r.d)+'–'+hhmm(s[1],r.y,r.mo,r.d)).join(', ')}

function upcoming(){
  const list=[];
  for(const k of Object.keys(S.months)){ const n=monthDays(k); for(let d=1;d<=n;d++){ const r=dayCalc(k,d); r.shifts.forEach((c,i)=>{const sp=r.spans[i]; if(sp) list.push({code:c,st:sp[0],en:sp[1],r});}); } }
  return list.filter(x=>x.en>new Date()).sort((a,b)=>a.st-b.st);
}
function gcalLink(code,st,en){
  const f=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const kind=isPagi(code)?'Pagi':'Petang';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(`Kerja ${code} (Shift ${kind})`)+'&dates='+f(st)+'/'+f(en)+'&ctz=Asia/Kuala_Lumpur&details='+encodeURIComponent('Dari Jadual Kerja & Claim');
}
function rel(dt){const ms=dt-new Date();if(ms<=0)return 'sedang berjalan';const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);if(h>=48)return `${Math.floor(h/24)} hari lagi`;return h?`${h} jam ${m} min lagi`:`${m} min lagi`}

function activeDay(){

    if(off===0||(nw>=st-3600000&&nw<=en+3*3600000))return {k,d:dt.getDate(),m:dt.getMonth()+1,y:dt.getFullYear(),r};}

function renderSettings(){
  const codes=[...new Set(['A1','A2','A3','B1','B2','B3',...Object.keys(S.times),...Object.values(S.months).flatMap(mo=>Object.values(mo).flatMap(s=>parseDay(s).shifts))])].sort();
  let h=`<div class="card"><b>Akaun roster</b><p class="note">${S.staffNo?`Masuk sebagai <b>${esc(S.name)}</b> (No. ${esc(S.staffNo)}). Roster dikemas kini sendiri bila apps dibuka dengan internet. Perubahan kau (tukar shift, cuti, OT) tak akan ditimpa.`:'Belum masuk.'}</p>
  <div class="row"><button class="btn primary" id="rsSync">Kemas kini roster sekarang</button><button class="btn" id="rsOut">Tukar pengguna</button></div></div>`;
  h+=`<div class="card"><b>Isi roster sebulan (manual)</b><p class="note">Pilih bulan, kemudian tulis kod shift dari hari 1 hingga akhir bulan, <b>asingkan dengan koma</b>. Double shift guna "/" (cth A2/B2). Hari kosong tulis "-".<br>Contoh: <code>-, B3, B3, OFF, REST, A2, A2, A3/B1, B PTH STBY</code><br>Atau hantar gambar roster pada Claude dan minta "senarai kod untuk apps", kemudian tampal di sini.</p>
  <div class="row"><input type="month" id="rMonth" value="${(()=>{const [yy,mm]=cur.split('-').map(Number);return yy+'-'+pad(mm)})()}"></div>
  <textarea id="rCodes" rows="3" style="width:100%;margin-top:8px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)" placeholder="B3, B3, OFF, REST, A2, ..."></textarea>
  <div class="row" style="margin-top:8px"><button class="btn primary" id="fillRoster">Masukkan roster</button><span id="rosterMsg" class="note"></span></div></div>`;
  h+=`<div class="card"><b>Backup & pindah data</b><p class="note">Data disimpan dalam phone/browser ni sahaja. Simpan backup selalu, dan guna fail backup untuk pindah ke phone lain.</p>
  <div class="row"><button class="btn" id="bkSave">Simpan backup</button><label class="btn" style="display:inline-block">Buka backup<input type="file" id="bkLoad" accept=".json,application/json" style="display:none"></label></div></div>`;
  h+=`<div class="card"><b>Kadar elaun (RM)</b><div class="row" style="margin-top:8px">
  <label>Pagi <input type="number" step="0.5" data-rate="pagi" value="${S.rates.pagi}"></label>
  <label>Petang <input type="number" step="0.5" data-rate="petang" value="${S.rates.petang}"></label>
  <label>CTO <input type="number" step="0.5" data-rate="cto" value="${S.rates.cto}"></label>
  <label class="row"><input type="checkbox" id="ctoAuto" ${S.ctoAuto!==false?'checked':''}> CTO setiap hari kerja (shift asal sahaja)</label>
  <label>Standby <input type="number" step="0.5" data-rate="stby" value="${S.rates.stby}"></label></div></div>`;
  h+=`<div class="card"><b>OT 1 jam setiap shift</b><p class="note">Setiap shift asal direkod OT pada jam terakhir shift tu (contoh A1 0400–1400 → OT 1300–1400). Double shift dan OT tambahan direkod berasingan.</p>
  <div class="row"><label class="row"><input type="checkbox" id="chOn" ${S.claimHour.on?'checked':''}> Aktif</label><label>Jam / shift <input type="number" step="0.5" min="0" id="chJam" value="${S.claimHour.jam}"></label><label class="row"><input type="checkbox" id="chSw" ${S.claimHour.swap?'checked':''}> Termasuk shift yang ditukar</label></div></div>`;
  h+=`<div class="card"><b>Waktu shift</b><p class="note">Kalau masa tamat lebih awal dari masa mula, ia dikira habis hari esoknya (contoh B2 1430–0030).</p><table><thead><tr><th>Kod</th><th>Mula</th><th>Tamat</th></tr></thead><tbody>`;
  codes.forEach(c=>{const t=S.times[c]||['',''];h+=`<tr><td><span class="pill ${isPagi(c)?'p-pagi':'p-petang'}">${c}</span></td><td><input type="time" data-time="${c}" data-i="0" value="${t[0]}"></td><td><input type="time" data-time="${c}" data-i="1" value="${t[1]}"></td></tr>`});
  h+=`</tbody></table></div>
  <div class="card"><b>Maklumat borang claim</b><p class="note">Keluar di bahagian atas borang Application for Overtime / Allowance.</p>
  <div class="row" style="margin-top:8px"><label style="flex:1;min-width:200px">Nama penuh<br><input id="nm" value="${esc(S.name)}" style="width:100%"></label><label>No. pekerja (ID penuh)<br><input id="sn" value="${esc(S.staffNo)}" style="width:140px"></label></div>
  <div class="row" style="margin-top:8px">${[['depot','Depot / Sector / Department','TRAIN OPERATION / AGL'],['designation','Designation','TRANSIT OFFICER'],['grade','Grade','JG 4'],['contact','Contact no','01X-XXXXXXX'],['superior','Nama immediate superior','']].map(([k,l,ph])=>`<label style="flex:1;min-width:180px">${l}<br><input data-form="${k}" value="${esc(S.form[k]||'')}" placeholder="${ph}" style="width:100%"></label>`).join('')}</div></div>
  <div class="row"><button class="btn primary" id="saveSet">Simpan tetapan</button></div>`;
  return h;
}

// ---- save ----
function buildDoc(){
  const json=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="ms">\n<head>'+HEAD_HTML+'</head>\n<body>\n<script type="application/json" id="state">'+json+'<\/script>\n<script>'+APP_SRC+'<\/script>\n</body>\n</html>\n';
}
async function save(msg){
  S._savedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));toast(msg||'Disimpan')}catch(e){toast('Tak dapat simpan dalam phone ni')}
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

// ---- day edit modal ----
function openDay(d){
  const slots=(S.months[cur]||{})[d]||[];const r=dayCalc(cur,d);const [y,m]=cur.split('-').map(Number);
  const md=document.createElement('div');md.className='modal';
  const ck=dkey(y,m,d);const ch=S.changes[ck]||null;
  const links=r.shifts.map((c,i)=>r.spans[i]?`<a class="btn" href="${gcalLink(c,r.spans[i][0],r.spans[i][1])}" target="_blank" rel="noopener">+ Google Calendar (${c})</a>`:'').join(' ');
  md.innerHTML=`<div class="card"><b>${HARI[new Date(y,m-1,d).getDay()]}, ${d} ${BULAN[m-1]} ${y}</b>
  <p class="note">Tulis kod shift. Untuk double shift, asingkan dengan "/" (contoh: A2 / B2). Contoh lain: OFF, REST, AL, MC, OH, BTS A, B PTH STBY.</p>
  <input id="dv" value="${esc(slots.join(' / '))}" style="width:100%">
  <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
  <b style="font-size:13px">Tukar shift / Cuti</b>${ch?`<div class="note">Roster asal: <b>${esc(ch.orig.join(' / ')||'-')}</b></div>`:''}
  <div class="seg" style="margin-top:6px">${[['none','Ikut roster'],['swap','Tukar shift'],['AL','AL'],['EL','EL'],['CL','CL'],['MC','MC']].map(([v,l])=>`<label><input type="radio" name="chg" value="${v}" ${(ch?ch.type:'none')===v?'checked':''}>${l}</label>`).join('')}</div>
  <div id="chSwap" style="margin-top:8px;display:${ch&&ch.type==='swap'?'block':'none'}"><div class="row"><input id="swNew" placeholder="Shift baru (cth B2 atau OFF)" value="${esc(ch&&ch.type==='swap'?ch.neu.join(' / '):'')}" style="flex:1;min-width:140px"><input id="swWith" placeholder="Tukar dengan siapa" value="${esc(ch&&ch.with||'')}" style="flex:1;min-width:140px"></div></div>
  <div id="chNote" style="margin-top:8px;display:${ch&&ch.type!=='none'?'block':'none'}"><input id="chN" placeholder="Catatan (sebab / no. rujukan)" value="${esc(ch&&ch.note||'')}" style="width:100%"></div></div>
  <label class="row" style="margin-top:10px"><input type="checkbox" id="dcto" ${r.ctoFlag?'checked':''}> Tuntut CTO hari ni</label>
  <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px"><b style="font-size:13px">OT tambahan / Meal break</b>${r.ot.filter(o=>!o.mtype).map(o=>`<div class="note">Auto: ${o.kind} ${fmtTime(o.st)}–${fmtTime(o.en)} (${fh(o.h)} jam)</div>`).join('')}
  ${r.ot.filter(o=>o.mtype).map(o=>`<div class="row" style="justify-content:space-between;margin-top:4px"><span class="pill ${o.mtype==='ot'?'p-ev':'p-leave'}">${o.kind} · ${fmtTime(o.st)}–${fmtTime(o.en)} · ${fh(o.h)} jam${o.note?' · '+esc(o.note):''}</span><button class="btn" style="padding:3px 8px" data-delot="${o.i}">Buang</button></div>`).join('')}
  <div class="row" style="margin-top:6px"><select id="otT"><option value="ot">OT tambahan</option><option value="meal">Meal break</option><option value="cover">Cover meal</option></select><input id="otS" type="time" style="width:110px"><span>–</span><input id="otE" type="time" style="width:110px"><input id="otN" placeholder="Catatan" style="flex:1;min-width:100px"></div></div>
  <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
  <div class="row"><b style="font-size:13px">Cuti umum</b><input id="dh" placeholder="Kosong kalau bukan cuti" value="${esc(hol(y,m,d)||'')}" style="flex:1"></div>
  <div style="margin-top:8px"><b style="font-size:13px">Event Bukit Jalil</b>${evs(y,m,d).map(e=>`<div class="row" style="justify-content:space-between;margin-top:4px"><span class="pill p-ev">★ ${esc(e.title)} · ${esc(e.venue||'')}${e.time?' '+e.time:''}</span><button class="btn" style="padding:3px 8px" data-delev="${esc(e.title)}">Buang</button></div>`).join('')}
  <div class="row" style="margin-top:6px"><input id="evt" placeholder="Nama event" style="flex:1;min-width:120px"><input id="evv" placeholder="Venue" style="width:110px"><input id="evh" type="time" style="width:100px"></div></div></div>
  <div class="row" style="margin-top:10px">${links}</div>
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="dx">Batal</button><button class="btn primary" id="ds">Simpan</button></div></div>`;
  document.body.appendChild(md);
  let ctoTouched=false; md.querySelector('#dcto').onchange=()=>{ctoTouched=true};
  md.querySelectorAll('input[name=chg]').forEach(i=>i.onchange=()=>{const v=i.value;md.querySelector('#chSwap').style.display=v==='swap'?'block':'none';md.querySelector('#chNote').style.display=v==='none'?'none':'block';});
  md.addEventListener('click',e=>{if(e.target===md||e.target.id==='dx')md.remove();
    const dot=e.target.closest('[data-delot]');if(dot){const a=S.otManual[ck]||[];a.splice(+dot.dataset.delot,1);if(!a.length)delete S.otManual[ck];md.remove();render();save('OT dibuang');return}
    const del=e.target.closest('[data-delev]');if(del){const k=dkey(y,m,d);S.events=S.events.filter(x=>!(x.date===k&&x.title===del.dataset.delev));md.remove();render();save('Event dibuang')}});
  md.querySelector('#ds').onclick=()=>{
    let v=md.querySelector('#dv').value.split('/').map(s=>s.trim().toUpperCase()).filter(Boolean);
    const typ=md.querySelector('input[name=chg]:checked').value;
    const orig=ch?ch.orig:v;
    if(typ==='none'){ if(ch){ v=(md.querySelector('#dv').value.trim()===ch.neu.join(' / '))?ch.orig:v; delete S.changes[ck]; } }
    else{
      const neu = typ==='swap' ? md.querySelector('#swNew').value.split('/').map(s=>s.trim().toUpperCase()).filter(Boolean) : [typ];
      if(typ==='swap'&&!neu.length){toast('Isi shift baru dulu');return}
      S.changes[ck]={type:typ,orig,neu,with:typ==='swap'?md.querySelector('#swWith').value.trim():'',note:md.querySelector('#chN').value.trim(),at:Date.now()};
      v=neu;
    }
    S.months[cur]=S.months[cur]||{};if(v.length)S.months[cur][d]=v;else delete S.months[cur][d];
    S.cto[cur]=S.cto[cur]||{};
    if(ctoTouched){ delete S.cto[cur][d]; const want=md.querySelector('#dcto').checked; if(want!==dayCalc(cur,d).ctoDefault) S.cto[cur][d]=want?1:0; }
    const hk=dkey(y,m,d),hv=md.querySelector('#dh').value.trim();if(hv)S.holidays[hk]=hv;else delete S.holidays[hk];
    const os=md.querySelector('#otS').value,oe=md.querySelector('#otE').value;
    if(os&&oe){(S.otManual[ck]=S.otManual[ck]||[]).push({start:os,end:oe,note:md.querySelector('#otN').value.trim(),type:md.querySelector('#otT').value});}
    else if(os||oe){toast('Isi masa mula dan tamat OT');return}
    const et=md.querySelector('#evt').value.trim();if(et)S.events.push({date:hk,title:et,venue:md.querySelector('#evv').value.trim()||'Bukit Jalil',time:md.querySelector('#evh').value});
    md.remove();render();save('Hari dikemas kini');
  };
}

// ---- exports ----
function claimRows(){
  const {rows,T}=monthCalc(cur);const [y,m]=cur.split('-').map(Number);
  const head=['Tarikh','Hari','Kod Shift','Catatan','Masa','Elaun Pagi (RM)','Elaun Petang (RM)','Elaun CTO (RM)','Jam OT','Standby (RM)','Jumlah (RM)'];
  const body=rows.filter(r=>r.shifts.length||r.stby||r.ctoFlag||r.otTot).map(r=>[`${pad(r.d)}/${pad(r.mo)}/${r.y}`,HARI[new Date(r.y,r.mo-1,r.d).getDay()],r.raw,r.workPH?'Kerja hari cuti umum ('+r.holiday+')':'',spanText(r),r.amt.pagi,r.amt.petang,r.amt.cto,+fh(r.otTot),r.amt.stby,r.amt.total]);
  const tot=['JUMLAH','','','','',T.pagi,T.petang,T.cto,+fh(T.otTot),T.stby,T.total];
  return {head,body,tot,T,title:`Claim Elaun ${BULAN[m-1]} ${y}`,file:`Claim_${BULAN[m-1]}_${y}_${S.name.split(' ').slice(-1)[0]}`};
}
async function dl(ext){
  if(!cap.downloads){toast('Muat turun tak tersedia di paparan ni');return}
  const c=claimRows();let data;
  if(ext==='xlsx'){
    if(!window.XLSX){toast('Excel tak dapat dimuat, guna CSV');return}
    const aoa=[[c.title],[`Nama: ${S.name}`,'','',`No. Pekerja: ${S.staffNo}`],[],c.head,...c.body,c.tot];
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:12},{wch:9},{wch:14},{wch:30},{wch:22},{wch:14},{wch:15},{wch:13},{wch:9},{wch:12},{wch:12}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Claim');
    const OL=otList(cur);const ws2=XLSX.utils.aoa_to_sheet([[`Rekod Jam OT ${c.title.replace('Claim Elaun ','')}`],[`Nama: ${S.name}`,'','',`No. Pekerja: ${S.staffNo}`],[],['Tarikh','Hari','Jenis','Mula','Tamat','Jam','Catatan','Status'],...OL.map(o=>[`${pad(o.r.d)}/${pad(o.r.mo)}/${o.r.y}`,HARI[new Date(o.r.y,o.r.mo-1,o.r.d).getDay()],o.kind,fmtTime(o.st),fmtTime(o.en),+fh(o.h),o.note,o.done?'Dah buat':'Akan datang']),['JUMLAH','','','','',+fh(OL.reduce((a,b)=>a+b.h,0)),'','']]);
    ws2['!cols']=[{wch:12},{wch:9},{wch:13},{wch:7},{wch:7},{wch:6},{wch:18},{wch:12}];XLSX.utils.book_append_sheet(wb,ws2,'Rekod OT');
    data=new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'}));
  }else{
    const q=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    data=[[c.title],[`Nama: ${S.name}`],[],c.head,...c.body,c.tot].map(r=>r.map(q).join(',')).join('\n');
  }
  try{await cap.downloads.save({filename:`${c.file}.${ext}`,data})}catch(e){if(e&&e.code!=='declined')toast('Tak dapat muat turun: '+(e.code||'ralat'))}
}
async function copySum(){
  const c=claimRows();const T=c.T;
  const txt=`${c.title}\n${S.name} (${S.staffNo})\nShift pagi: ${T.nPagi} x RM${S.rates.pagi} = RM${T.pagi.toFixed(2)}\nShift petang: ${T.nPetang} x RM${S.rates.petang} = RM${T.petang.toFixed(2)}\nCTO: ${T.nCto} x RM${S.rates.cto} = RM${T.cto.toFixed(2)}\nJam OT: ${fh(T.otTot)} jam (dah buat ${fh(T.otDone)} jam)\nJUMLAH ELAUN: RM${T.total.toFixed(2)}`;
  try{await navigator.clipboard.writeText(txt);toast('Ringkasan disalin')}catch(e){toast('Tak dapat salin')}
}

function hhmm(dt,y,mo,d){const base=new Date(y,mo-1,d);const mins=Math.round((dt-base)/60000);return pad(Math.floor(mins/60))+pad(mins%60)}
function formRows(k){
  const [y,mo]=k.split('-').map(Number);const n=monthDays(k);const rows={};
  const T={E:0,F:0,G:0,J:0,K:0,L:0,M:0,Q:0,R:0};
  for(let d=1;d<=n;d++){
    const has=(S.months[k]||{})[d]||S.otManual[dkey(y,mo,d)];if(!has)continue;
    const r=dayCalc(k,d);const c={};const lines=[];
    const ch=S.changes[dkey(y,mo,d)];
    const man=r.ot.filter(o=>o.mtype);
    const manLine=o=>'*'+(o.mtype==='ot'?(o.note||'OT').toUpperCase():MAN_LINE[o.mtype]);
    const T4=dt=>hhmm(dt,y,mo,d);
    if(r.shifts.length){
      lines.push(r.shifts.length>1?`${r.shifts[0]}/OT ${r.shifts.slice(1).join('/')} *Excess Working`:`${r.shifts[0]} *Excess Working`);
      if(ch&&ch.type==='swap')lines.push(`*SWAP${ch.with?' '+ch.with.toUpperCase():''} (ASAL ${ch.orig.join('/')})`);
      if(r.holiday)lines.push(`*PH ${r.holiday.replace(/\*$/,'').toUpperCase()}`);
      man.forEach(o=>{const l=manLine(o);if(!lines.includes(l))lines.push(l)});
      const st=r.spans[0]?r.spans[0][0]:null;
      if(st){c.C=T4(st);c.D=T4(r.spans[0][1]);}
      if(r.holiday)c.G=1;else c.E=1;
      if(r.ot.length){c.H=r.ot.map(o=>T4(o.st)).join('\n');c.I=r.ot.map(o=>T4(o.en)).join('\n');if(r.holiday)c.L=+fh(r.otTot);else c.J=+fh(r.otTot);}
    }else if(r.off){
      lines.push(r.raw);
      man.forEach(o=>{const l=manLine(o);if(!lines.includes(l))lines.push(l)});
      if(man.length){
        const h=man.reduce((a,b)=>a+b.h,0);
        if(/REST/.test(r.raw.toUpperCase())){c.C=man.map(o=>T4(o.st)).join('\n');c.D=man.map(o=>T4(o.en)).join('\n');c.F=h>4?1:0.5;}
        else{c.E=1;c.H=man.map(o=>T4(o.st)).join('\n');c.I=man.map(o=>T4(o.en)).join('\n');c.J=+fh(h);}
      }
    }else{
      lines.push(r.raw);
      if(ch&&ch.note)lines.push('*'+ch.note.toUpperCase());
    }
    const shiftRM=r.amt.pagi+r.amt.petang;if(shiftRM)c.M=shiftRM;
    if(r.amt.cto)c.R=r.amt.cto;if(r.amt.stby)c.Q=r.amt.stby;
    c.B=lines.join('\n');
    for(const x in T)if(typeof c[x]==='number')T[x]+=c[x];
    rows[d]=c;
  }
  return {rows,T,y,mo};
}
function buildClaimForm(k){

}

  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(enc.salt),iterations:enc.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(enc.iv)},key,ub(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function syncRoster(pw,id,opts={}){
  id=String(id).trim().replace(/^0+/,'');pw=String(pw).trim().toUpperCase();
  const idx=await (await fetch('roster/index.json',{cache:'no-store'})).json();
  let found=0,added=[];
  for(const mk of idx.months){
    const enc=await (await fetch(`roster/${mk}.enc.json`,{cache:'no-store'})).json();
    let data;try{data=await decryptRoster(enc,pw)}catch(e){throw new Error('pw')}
    const me=data.staff.find(x=>String(x.id).replace(/^0+/,'')===id);
    if(!me)continue;found++;
    const [yy,mm]=mk.split('-').map(Number);const k=`${yy}-${mm}`;
    const had=!!S.months[k];const mo=S.months[k]||{};const out={};
    for(let d=1;d<=monthDays(k);d++){
      const ch=S.changes[dkey(yy,mm,d)];
      if(ch&&mo[d]) out[d]=mo[d];
      else if(me.days[d]&&me.days[d].length) out[d]=me.days[d];
    }
    S.months[k]=out;if(!had)added.push(k);
    if(opts.login||!S.name)S.name=me.name;S.staffNo=String(me.id);S.line=me.line;
  }
  if(!found)throw new Error('id');
  return added;
}
async function doLogin(){
  const pw=document.getElementById('lgPw').value.trim().toUpperCase(),id=document.getElementById('lgId').value.trim(),msg=document.getElementById('lgMsg');
  if(!pw||!id){msg.textContent='Isi dua-dua.';return}
  msg.textContent='Sedang muat roster...';
  try{
    if(S.staffNo&&S.staffNo.replace(/^0+/,'')!==id.replace(/^0+/,'')){const keep={holidays:S.holidays,events:S.events,times:S.times,rates:S.rates};S=JSON.parse(JSON.stringify(BASE));Object.assign(S,keep);}
    const added=await syncRoster(pw,id,{login:true});setTeamPw(pw);
    const ks=Object.keys(S.months).sort(mkSort);const nowK=`${now.getFullYear()}-${now.getMonth()+1}`;cur=S.months[nowK]?nowK:(ks[ks.length-1]||cur);
    view='kalendar';render();save(`Selamat datang, ${S.name}. Jadual ${added.length} bulan dimuat.`);
  }catch(e){msg.textContent=!navigator.onLine?'Perlukan internet untuk masuk kali pertama.':e.message==='pw'?'Kata laluan pasukan salah.':e.message==='id'?'No. ID tak jumpa dalam roster.':'Tak dapat muat roster. Cuba lagi.';}
}
async function autoSync(){
  const pw=teamPw();if(!pw||!S.staffNo||!navigator.onLine)return;
  try{const added=await syncRoster(pw,S.staffNo);if(added.length){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){};render();toast('Roster baru: '+added.map(k=>{const [yy,mm]=k.split('-').map(Number);return BULAN[mm-1]+' '+yy}).join(', '))}else{try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){};render()}}catch(e){}
}
function fillRoster(){
  const mv=document.getElementById('rMonth').value;const msg=document.getElementById('rosterMsg');
  if(!mv){msg.textContent='Pilih bulan dulu.';return}
  const [yy,mm]=mv.split('-').map(Number);const k=`${yy}-${mm}`;const n=monthDays(k);
  const toks=document.getElementById('rCodes').value.split(/[,\n;]+/).map(t=>t.trim());
  if(toks.length&&toks[toks.length-1]==='')toks.pop();
  if(!toks.length){msg.textContent='Tulis kod shift dulu.';return}
  if(toks.length>n){msg.textContent=`Ada ${toks.length} kod, tapi bulan ni cuma ${n} hari.`;return}
  const days={};toks.forEach((t,i)=>{const u=t.toUpperCase();if(u&&u!=='-')days[String(i+1)]=u.split('/').map(x=>x.trim()).filter(Boolean)});
  S.months[k]=days;cur=k;view='kalendar';render();save(`Roster ${BULAN[mm-1]} ${yy} dimasukkan (${toks.length} hari). Semak ya.`);
}
function saveBackup(){const d=new Date();cap.downloads.save({filename:`backup_jadual_kerja_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`,data:JSON.stringify(S,null,1)})}
function loadBackup(f){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||typeof d!=='object'||!d.times)throw 0;d.holidays=d.holidays||{};d.events=d.events||[];d.months=d.months||{};S=mergeDefaults(d);for(const k of ['cto','changes','otManual'])S[k]=S[k]||{};S.leaveEnt=S.leaveEnt||{AL:'',EL:'',CL:''};S.form=S.form||{};S.claimHour=S.claimHour||{on:true,jam:1,swap:true};if(S.ctoAuto===undefined)S.ctoAuto=true;const ks=Object.keys(S.months).sort(mkSort);if(ks.length)cur=ks[ks.length-1];view='kalendar';render();save('Backup dibuka')}catch(e){toast('Fail backup tak sah')}};fr.readAsText(f)}
function dlIcs(){
  const [y,m]=cur.split('-').map(Number);const n=monthDays(cur);const f=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Jadual Kerja//MS','CALSCALE:GREGORIAN','X-WR-CALNAME:Jadual Kerja','BEGIN:VTIMEZONE','TZID:Asia/Kuala_Lumpur','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0800','TZOFFSETTO:+0800','TZNAME:MYT','END:STANDARD','END:VTIMEZONE'];
  let cnt=0;
  for(let d=1;d<=n;d++){const r=dayCalc(cur,d);r.shifts.forEach((c,i)=>{const sp=r.spans[i];if(!sp)return;cnt++;
    L.push('BEGIN:VEVENT',`UID:jk-${y}${pad(m)}${pad(d)}-${c.replace(/\s/g,'')}-${(S.staffNo||'x')}@jadualkerja`,`DTSTAMP:${f(new Date())}`,`DTSTART;TZID=Asia/Kuala_Lumpur:${f(sp[0])}`,`DTEND;TZID=Asia/Kuala_Lumpur:${f(sp[1])}`,`SUMMARY:Kerja ${c}${i>0?' (OT double shift)':''}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:Shift ${c} mula dalam 1 jam`,'TRIGGER:-PT60M','END:VALARM');
    if(isPagi(c)&&i===0){const prev=new Date(sp[0]);prev.setDate(prev.getDate()-1);prev.setHours(21,0,0,0);L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:Esok shift pagi ${c}`,`TRIGGER:-PT${Math.round((sp[0]-prev)/60000)}M`,'END:VALARM');}
    L.push('END:VEVENT');});}
  L.push('END:VCALENDAR');
  if(!cnt){toast('Tiada shift bulan ni');return}
  cap.downloads.save({filename:`Jadual_Kerja_${BULAN[m-1]}_${y}.ics`,data:L.join('\r\n')+'\r\n'});
}
root.addEventListener('change',e=>{if(e.target.id==='bkLoad'&&e.target.files[0])loadBackup(e.target.files[0])});
// ---- events ----
root.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-quick],[data-mnav],[data-ynav],[data-day],[data-msg],[data-undo],#saveEnt,#cpyot,#dlform,#dlx,#dlc,#cpy,#saveSet,#fillRoster,#bkSave,#dlics,#lgGo,#rsSync,#rsOut');if(!t)return;
  if(t.dataset.quick){openQuick(t.dataset.quick);return}
  if(t.dataset.ynav){const [yy,mm]=cur.split('-').map(Number);cur=`${yy+ +t.dataset.ynav}-${mm}`;render();return}
  if(t.dataset.msg){const c=S.changes[t.dataset.msg];navigator.clipboard.writeText(chMsg(t.dataset.msg,c)).then(()=>toast('Mesej disalin')).catch(()=>toast('Tak dapat salin'));return}
  if(t.dataset.undo){const k=t.dataset.undo,c=S.changes[k];const [yy,mm,dd]=k.split('-').map(Number);const mk=`${yy}-${mm}`;S.months[mk]=S.months[mk]||{};if(c.orig.length)S.months[mk][dd]=c.orig;else delete S.months[mk][dd];delete S.changes[k];render();save('Dibatalkan, ikut roster asal');return}
  if(t.id==='saveEnt'){root.querySelectorAll('[data-ent]').forEach(i=>S.leaveEnt[i.dataset.ent]=i.value===''?'':+i.value);render();save('Kelayakan disimpan');return}
  if(t.dataset.tab){view=t.dataset.tab;render()}
  else if(t.dataset.mnav){cur=shiftMonth(cur,+t.dataset.mnav);render()}
  else if(t.dataset.day)openDay(+t.dataset.day);
  else if(t.id==='dlform')dlForm();
  else if(t.id==='dlx')dl('xlsx');else if(t.id==='dlc')dl('csv');else if(t.id==='cpy')copySum();
  else if(t.id==='fillRoster')fillRoster();
  else if(t.id==='lgGo')doLogin();
  else if(t.id==='rsSync'){const pw=teamPw();if(!pw||!S.staffNo){view='login';render();return}toast('Sedang kemas kini...');syncRoster(pw,S.staffNo).then(a=>{render();save(a.length?'Roster baru dimuat':'Roster dah terkini')}).catch(e=>toast(e.message==='pw'?'Kata laluan pasukan dah bertukar. Masuk semula.':e.message==='id'?'ID tak jumpa dalam roster':'Tiada internet / gagal'))}
  else if(t.id==='rsOut'){if(confirm('Tukar pengguna? Simpan backup dulu kalau perlu. Data dalam phone ni akan dikosongkan.')){try{localStorage.removeItem(LS_KEY)}catch(e){};const keep={holidays:S.holidays,events:S.events};S=JSON.parse(JSON.stringify(BASE));Object.assign(S,keep);view='login';render();}}
  else if(t.id==='bkSave')saveBackup();
  else if(t.id==='dlics')dlIcs();
  else if(t.id==='cpyot'){const L=otList(cur);const [yy,mm]=cur.split('-').map(Number);const txt=`Rekod OT ${BULAN[mm-1]} ${yy}\n${S.name} (${S.staffNo})\n`+L.map(o=>`${o.r.d}/${o.r.mo} ${o.kind} ${fmtTime(o.st)}-${fmtTime(o.en)} = ${fh(o.h)} jam${o.done?'':' (akan datang)'}`).join('\n')+`\nJumlah: ${fh(L.reduce((a,b)=>a+b.h,0))} jam`;navigator.clipboard.writeText(txt).then(()=>toast('Rekod OT disalin')).catch(()=>toast('Tak dapat salin'))}
  else if(t.id==='saveSet'){
    root.querySelectorAll('[data-rate]').forEach(i=>S.rates[i.dataset.rate]=parseFloat(i.value)||0);
    root.querySelectorAll('[data-time]').forEach(i=>{const c=i.dataset.time;S.times[c]=S.times[c]||['',''];S.times[c][+i.dataset.i]=i.value});
    for(const c of Object.keys(S.times))if(!S.times[c][0]&&!S.times[c][1])delete S.times[c];
    S.claimHour={on:document.getElementById('chOn').checked,jam:parseFloat(document.getElementById('chJam').value)||0,swap:document.getElementById('chSw').checked};
    S.ctoAuto=document.getElementById('ctoAuto').checked;
    root.querySelectorAll('[data-form]').forEach(i=>S.form[i.dataset.form]=i.value.trim().toUpperCase());
    S.name=document.getElementById('nm').value.trim()||S.name;S.staffNo=document.getElementById('sn').value.trim();
    render();save('Tetapan disimpan');
  }
});
render();
setInterval(()=>{if(view==='kalendar')render()},60000);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
if(!S.staffNo){ view='login'; render(); } else { autoSync(); }
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lgPw'||e.target.id==='lgId'))doLogin()});
})();
